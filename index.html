<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Chat</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f3f4f6; height: 100vh; display: flex; justify-content: center; }
  #app { width: 100%; max-width: 640px; height: 100%; background: #fff; display: flex; flex-direction: column; position: relative; }
  header { padding: 14px 16px; background: #2563eb; color: #fff; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  header span { flex: 1; }
  header button { padding: 6px 10px; font-size: 13px; background: rgba(255,255,255,.2); color: #fff; }
  #auth { flex: 1; flex-direction: column; justify-content: center; padding: 24px; gap: 10px; display: flex; }
  #auth h2 { margin: 0 0 6px; }
  #chat { flex: 1; flex-direction: column; min-height: 0; display: none; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.4; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #2563eb; color: #fff; }
  .bot { align-self: flex-start; background: #e5e7eb; color: #111; }
  form { display: flex; gap: 8px; }
  #sendform { padding: 12px; border-top: 1px solid #e5e7eb; }
  input { flex: 1; padding: 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 16px; }
  button { padding: 12px 18px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; font-size: 16px; cursor: pointer; }
  button.secondary { background: #e5e7eb; color: #111; }
  button:disabled { opacity: .5; }
  #err { color: #b91c1c; min-height: 1.2em; font-size: 14px; }

  #history { display: none; position: absolute; top: 52px; left: 0; bottom: 0; width: 100%; max-width: 300px;
             background: #fff; border-right: 1px solid #e5e7eb; box-shadow: 2px 0 8px rgba(0,0,0,.1);
             overflow-y: auto; z-index: 5; }
  #history h3 { margin: 0; padding: 14px 16px 8px; font-size: 15px; }
  #histlist { padding-bottom: 12px; }
  .item { display: flex; align-items: center; gap: 6px; padding: 10px 16px; cursor: pointer; border-bottom: 1px solid #f3f4f6; }
  .item:hover { background: #f3f4f6; }
  .item.active { background: #dbeafe; }
  .item .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  .item .del { padding: 2px 8px; font-size: 16px; border-radius: 6px; }
  .empty { padding: 10px 16px; color: #6b7280; font-size: 14px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="histbtn" style="display:none">History</button>
    <span>Customer Support</span>
    <button id="newchat" style="display:none">New chat</button>
    <button id="logout" style="display:none">Log out</button>
  </header>

  <div id="history">
    <h3>Past chats</h3>
    <div id="histlist"></div>
  </div>

  <div id="auth">
    <h2>Log in or sign up</h2>
    <form id="authform" style="flex-direction:column">
      <input id="email" type="email" placeholder="Email" autocomplete="email" required>
      <input id="password" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" required>
      <button type="submit">Log in</button>
      <button type="button" id="signup" class="secondary">Sign up</button>
    </form>
    <div id="err"></div>
  </div>

  <div id="chat">
    <div id="log"></div>
    <form id="sendform">
      <input id="input" placeholder="Type your question..." autocomplete="off" required>
      <button id="send">Send</button>
    </form>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let token = localStorage.getItem("token");
let convId = null;

function show() {
  $("auth").style.display = token ? "none" : "flex";
  $("chat").style.display = token ? "flex" : "none";
  for (const id of ["histbtn", "newchat", "logout"]) $(id).style.display = token ? "" : "none";
  if (!token) $("history").style.display = "none";
}

function add(text, who) {
  const d = document.createElement("div");
  d.className = "msg " + who;
  d.textContent = text;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
  return d;
}

function logout() {
  token = null;
  localStorage.removeItem("token");
  show();
}

async function api(path, method, body) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && token) logout();
  if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Something went wrong");
  return data;
}

function greet() {
  $("log").innerHTML = "";
  convId = null;
  add("Hi! How can I help you today?", "bot");
}

function showMessages(messages) {
  $("log").innerHTML = "";
  messages.forEach((m) => add(m.content, m.role === "user" ? "user" : "bot"));
}

async function startChat() {
  show();
  greet();
  try {
    const h = await api("/history", "GET");
    convId = h.conversation_id;
    if (h.messages.length) showMessages(h.messages);
  } catch (e) {}
}

// ---------- Past chats panel ----------
async function loadList() {
  const list = await api("/conversations", "GET");
  const box = $("histlist");
  box.innerHTML = "";
  if (!list.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "No past chats yet.";
    box.appendChild(e);
    return;
  }
  list.forEach((c) => {
    const row = document.createElement("div");
    row.className = "item" + (c.id === convId ? " active" : "");
    const t = document.createElement("span");
    t.className = "t";
    t.textContent = c.title;
    const d = document.createElement("button");
    d.className = "del secondary";
    d.textContent = "×";
    d.title = "Delete this chat";
    row.addEventListener("click", () => openConv(c.id));
    d.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!confirm("Delete this chat?")) return;
      try {
        await api("/conversations/" + c.id, "DELETE");
        if (c.id === convId) greet();
        await loadList();
      } catch (err) {}
    });
    row.append(t, d);
    box.appendChild(row);
  });
}

async function openConv(id) {
  try {
    const h = await api("/conversations/" + id, "GET");
    convId = h.conversation_id;
    showMessages(h.messages);
    $("history").style.display = "none";
  } catch (e) {}
}

$("histbtn").addEventListener("click", async () => {
  const p = $("history");
  if (p.style.display === "block") { p.style.display = "none"; return; }
  p.style.display = "block";
  try { await loadList(); } catch (e) {}
});

// ---------- Login / chat ----------
async function authenticate(path) {
  $("err").textContent = "";
  try {
    const data = await api(path, "POST", { email: $("email").value, password: $("password").value });
    token = data.token;
    localStorage.setItem("token", token);
    $("password").value = "";
    await startChat();
  } catch (e) {
    $("err").textContent = e.message;
  }
}

$("authform").addEventListener("submit", (e) => { e.preventDefault(); authenticate("/login"); });
$("signup").addEventListener("click", () => authenticate("/register"));
$("logout").addEventListener("click", async () => {
  try { await api("/logout", "POST"); } catch (e) {}
  logout();
});
$("newchat").addEventListener("click", () => { greet(); $("history").style.display = "none"; });

$("sendform").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  add(text, "user");
  const wait = add("Thinking...", "bot");
  $("send").disabled = true;
  try {
    const data = await api("/chat", "POST", { message: text, conversation_id: convId });
    convId = data.conversation_id;
    wait.textContent = data.reply;
  } catch (err) {
    wait.textContent = "Sorry: " + err.message;
  }
  $("send").disabled = false;
  $("input").focus();
});

if (token) startChat(); else show();
</script>
</body>
</html>
