<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Chat</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f3f4f6; height: 100vh; display: flex; justify-content: center; }
  #app { width: 100%; max-width: 640px; height: 100%; display: flex; flex-direction: column; background: #fff; }
  header { padding: 14px 16px; background: #2563eb; color: #fff; font-weight: 600; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.4; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #2563eb; color: #fff; }
  .bot { align-self: flex-start; background: #e5e7eb; color: #111; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e5e7eb; }
  input { flex: 1; padding: 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 16px; }
  button { padding: 0 18px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; font-size: 16px; cursor: pointer; }
  button:disabled { opacity: .5; }
</style>
</head>
<body>
<div id="app">
  <header>Customer Support</header>
  <div id="log"></div>
  <form id="form">
    <input id="input" placeholder="Type your question..." autocomplete="off" required>
    <button id="send">Send</button>
  </form>
</div>
<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
let history = [];

function add(text, who) {
  const d = document.createElement("div");
  d.className = "msg " + who;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

add("Hi! How can I help you today?", "bot");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  add(text, "user");
  const wait = add("Thinking...", "bot");
  send.disabled = true;
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history: history.slice(-10) })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Something went wrong");
    wait.textContent = data.reply;
    history.push({ role: "user", content: text }, { role: "assistant", content: data.reply });
  } catch (err) {
    wait.textContent = "Sorry, something went wrong. Please try again.";
  }
  send.disabled = false;
  input.focus();
});
</script>
</body>
</html>
